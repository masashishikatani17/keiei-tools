<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません｜経営tools</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- 404はどの階層のURLでも表示されるため、このページだけ自己完結のスタイルにしている -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f7fa;
      color: #22303c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI",
        "Yu Gothic", "Meiryo", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      max-width: 480px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #d7dee5;
      border-radius: 12px;
      padding: 40px 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 24px; color: #62707d; font-size: 0.95rem; }
    a.btn {
      display: inline-block;
      min-height: 48px;
      padding: 12px 28px;
      border-radius: 8px;
      background: #1f6fb2;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a.btn:hover { background: #185a91; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。トップページから、使えるツールの一覧をご覧ください。</p>
    <a class="btn" href="/">経営tools トップへ</a>
  </div>
</body>
</html>
